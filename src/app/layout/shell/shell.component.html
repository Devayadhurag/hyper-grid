<div class="shell">

  <!-- ═══ COLLAPSIBLE NAV ═══ -->
  <nav class="nav" [class.nav--expanded]="navExpanded() || navHovered()"
       (mouseenter)="navHovered.set(true)"
       (mouseleave)="navHovered.set(false)">

    <div class="nav__logo">
      <span class="nav__logo-mark">HG</span>
    </div>

    <ul class="nav__list" role="navigation" aria-label="Main navigation">
      @for (item of navItems; track item.route) {
      <li class="nav__item" routerLinkActive="nav__item--active" [routerLink]="item.route" [routerLinkActiveOptions]="{exact: item.route === ''}">
        <lucide-icon class="nav__icon" [img]="item.icon" aria-hidden="true"></lucide-icon>
        <span class="nav__label">{{ item.label }}</span>
      </li>
      }
    </ul>

    <div class="nav__spacer"></div>

    <button class="nav__toggle" (click)="toggleNav()"
      [attr.aria-label]="(navExpanded() || navHovered()) ? 'Collapse navigation' : 'Expand navigation'"
      [attr.aria-expanded]="navExpanded() || navHovered()">
      <lucide-icon [img]="(navExpanded() || navHovered()) ? ChevronLeft : ChevronRight"></lucide-icon>
    </button>

  </nav>

  <div class="main">

    <header class="header">
      <span class="header__title">HyperGrid</span>
      <div class="header__meta">
        <time class="header__date" [dateTime]="today">{{ today | date: 'MMM dd, yyyy' | uppercase }}</time>
        <div class="header__avatar" aria-label="User menu">DY</div>
      </div>
    </header>

    <!-- Ticker Tape -->
    <hg-ticker-tape [items]="tickerItems()"></hg-ticker-tape>

    <!-- Router content -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
